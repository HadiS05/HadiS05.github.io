<!-- Template for window -->
<div class="window min-w-[200px] sm:min-w-[450px] md:min-w-[600px] transition-[opacity,transform] center-window duration-500 resize">
    <div class="status-bar transition-colors bg-gray-300/60">
        <button class="minimize-btn hover:bg-black/10 py-2 px-4 duration-300">
            <i class="bi bi-dash-lg"></i>
        </button>
        <button class="resize-btn hover:bg-black/10 py-2 px-4 duration-300">
            <i class="bi bi-arrows-angle-expand"></i>
        </button>
        <button class="close-btn hover:bg-red-600 py-2 px-4 duration-300">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div class="content bg-white">
        <div class="flex flex-row p-[20px] gap-4 items-center justify-center h-full">
            <img src="/assets/img/sadtab.png" class="max-w-100">
            <span class="font-mono">Aw snap...looks like that app doesn't exist.</span>
        </div>
    </div>
</div>
