<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Hadi Shaheryar</title>
        <link rel="stylesheet" href="home.css"></link>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    </head>

    <body>
        <div class="w-screen h-screen m-0 p-0">
            <div class="main-screen flex flex-col h-full">

                <div class="desktop w-full h-full p-2 overflow-y-scroll sm:overflow-hidden relative">
                    <div class="app-grid grid grid-cols-3 sm:flex sm:flex-col sm:flex-wrap sm:content-start p-4 sm:h-full gap-4">
                    </div>
                </div>

                <div class="task-bar w-full h-full p-4 flex flex-row items-center justify-center gap-2 bg-black/30 backdrop-blur-sm max-h-[50px] border-t border-t-gray-700">

                    <div class="task-bar-menu flex-1/3 flex flex-row items-center justify-center p-2 bg-black/10 rounded-lg shadow-md hover:bg-white/10 transition-colors duration-500">
                        <div class="icon" data-path="/assets/icons/info.svg" title="Quick Menu"></div>
                    </div>

                    <div class="task-bar-content flex-1 hidden sm:block">
                        <div class="task-bar-apps flex flex-row gap-1 items-center justify-center w-1/2 h-full py-1 px-4 mx-auto">
                        </div>
                    </div>

                    <div class="task-bar-controls flex-1/3 flex flex-row items-center justify-center bg-black/10 p-2 rounded-lg shadow-md hover:bg-white/10 transition-colors duration-500">
                        <div class="icon inline rotate-180" data-path="/assets/icons/arrow_up.svg" title="Settings"></div> 
                    </div>
                </div>
            </div>
        </div>

        <!-- Template Elements -->
        <template>
            <div class="icon-title-card sm:min-w-[50px] max-h-fit p-2 flex flex-col gap-1 items-center justify-center hover:bg-white/10 hover:cursor-pointer transition-colors duration-300">
                <div class="app-icon">
                    <div class="h-8 w-8 rounded-full border-black border-8 p-2 border-b-transparent animate-spin">
                    </div>
                </div>
                <div class="app-title text-center text-white font-sans font-thin text-sm">App 1</div>
            </div>

            <div class="icon-card p-2 hover:bg-white/10 rounded-xl hover:cursor-pointer transition-colors duration-300">
                <div class="app-icon">
                    <div class="h-0.5 w-0.5 rounded-full border-black border-4 p-2 border-b-transparent animate-spin">
                    </div>
                </div>
            </div>

            <div class="start-menu p-4 rounded-2xl grid grid-cols-2 grid-rows-1">

                <div class="quick-start-menu flex flex-col">
                    <div class="quick-item w-full p-4 flex flex-row">
                        <img class="quick-item-icon flex-1/4" src="/" alt="app icon"/>
                        <span class="quick-item-title flex-1">Default App</span>
                    </div>
                </div>

                <div class="detailed-menu grid grid-cols-1 grid-rows-auto">
                    <img class="detailed-menu-icon"/>

                    <div class=""></div>

                </div>
            </div>
        </template>

        <script src="/apploader/apploader.js"></script>
        <script src="main.js"></script>
    </body>
</html>
