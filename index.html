<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>h-shaheryar</title>
        <link rel="stylesheet" href="/style/home.css"></link>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body>
        <div class="w-screen h-screen m-0 p-0">
            <div class="main-screen grid grid-cols-1 grid-rows-[10fr_1fr] h-full">

                <div class="desktop bg-amber-500 w-full h-full p-4 overflow-y-scroll sm:overflow-hidden">
                    <div class="app-grid grid grid-cols-3 grid-rows-auto p-4 sm:w-1/3 gap-4 items-start">
                    </div>
                </div>

                <div class="task-bar bg-amber-800 w-full h-full p-4 flex flex-row items-center justify-center gap-2">
                    <div class="task-bar-menu flex-1/3 p-2 bg-amber-100 rounded-lg hover:bg-gray-900 transition-colors duration-500">
                        Start Super long 
                    </div>

                    <div class="task-bar-content flex-1 hidden sm:block">
                        <div class="task-bar-apps flex flex-row justify-center items-center w-1/2 bg-gray-800 h-full py-1 px-4 rounded-2xl mx-auto">
                        </div>
                    </div>

                    <div class="task-bar-controls flex-1/3 bg-gray-800 p-2 rounded-lg hover:bg-gray-900 transition-colors duration-500">
                        Controls Menu
                    </div>
                </div>
            </div>
        </div>

        <!-- Template Elements -->
        <template>
            <div class="icon-title-card p-2 flex flex-col gap-1 items-center justify-center hover:bg-white/10">
                <div class="app-icon">
                    <div class="h-8 w-8 rounded-full border-black border-8 p-2 border-b-transparent animate-spin">
                    </div>
                </div>
                <div class="app-title text-center">App 1</div>
            </div>

            <div class="icon-card p-2 hover:bg-white/10 rounded-xl">
                <div class="app-icon">
                    <div class="h-0.5 w-0.5 rounded-full border-black border-4 p-2 border-b-transparent animate-spin">
                    </div>
                </div>
            </div>

            <div class="start-menu p-4 rounded-2xl grid grid-cols-2 grid-rows-1">

                <div class="quick-start-menu flex flex-col">
                    <div class="quick-item w-full p-4 flex flex-row">
                        <img class="quick-item-icon flex-1/4" src="/" alt="app icon"/>
                        <span class="quick-item-title flex-1">Default App</span>
                    </div>
                </div>

                <div class="detailed-menu grid grid-cols-1 grid-rows-auto">
                    <img class="detailed-menu-icon"/>

                    <div class=""></div>

                </div>
            </div>
        </template>

        <script src="/script/main.js"></script>
    </body>
</html>
